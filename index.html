<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA MART</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--k:#14110f;--b:#f3e6d3;--g:#c9a24d;--w:#fff;--m:#6f655b}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Jost,system-ui,sans-serif;color:var(--k);background:#fbf8f3}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:.2em 0}a{color:inherit}
header{background:var(--k);color:var(--b);position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:12px 5vw;flex-wrap:wrap}.logo{font-size:28px;letter-spacing:.12em;text-decoration:none;color:var(--b)}.logo b{color:var(--g)}
header nav{display:flex;gap:16px;flex:1}header a{text-decoration:none}header input{padding:8px 12px;border-radius:20px;border:0;width:170px}
main{padding:24px 5vw;max-width:1280px;margin:auto;min-height:70vh}.hero{background:linear-gradient(90deg,#14110f 36%,rgba(20,17,15,.6) 62%,rgba(20,17,15,.05)),url(/uploads/hero.jpg) right center/cover,var(--k);min-height:340px;color:var(--b);border-radius:6px;padding:8vw 6vw;margin-bottom:24px}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.05}.hero p{max-width:420px}
.btn{display:inline-block;background:var(--b);color:var(--k);border:1px solid var(--g);padding:10px 20px;border-radius:30px;cursor:pointer;font:inherit;text-decoration:none;transition:.2s}.btn:hover{background:var(--g)}.dk{background:var(--k);color:var(--b)}.dk:hover{background:#000}.sm{padding:6px 12px;font-size:13px}.red{color:#a33}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{background:var(--w);border:1px solid #eadfce;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:linear-gradient(135deg,var(--b),#e4d1b4)}.card div.i{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.card .row{margin-top:auto;display:flex;gap:6px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:18px 0}.cat{background-color:var(--k);color:var(--b);padding:16px;border-radius:6px;text-decoration:none;font-family:'Cormorant Garamond',serif;font-size:22px;border-bottom:3px solid var(--g)}
.sh{margin:34px 0 12px;font-size:30px}.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.cat{background-size:cover;background-position:center;min-height:130px;display:flex;align-items:flex-end}.old{text-decoration:line-through;color:var(--m)}.sale{color:#8a6a1f;font-weight:500}.tag{background:var(--g);color:#000;font-size:12px;padding:1px 7px;border-radius:10px}.star{color:var(--g)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}input,select,textarea{padding:9px;border:1px solid #d8c9b2;border-radius:5px;font:inherit;background:#fff}.f{display:grid;gap:10px;max-width:520px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:30px}.pg>div>img{width:100%;border-radius:6px}.th{display:flex;gap:8px;margin-top:8px}.th img{width:64px;height:64px;object-fit:cover;cursor:pointer;border-radius:4px}
table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:8px;border-bottom:1px solid #eadfce;text-align:left;vertical-align:top;font-size:14px}.box{background:#fff;border:1px solid #eadfce;border-radius:6px;padding:16px}
footer{background:var(--k);color:var(--b);padding:28px 5vw;display:flex;gap:18px;flex-wrap:wrap}footer a{opacity:.8}#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--k);color:var(--b);padding:10px 20px;border-radius:30px;opacity:0;transition:.3s;z-index:9}#t.on{opacity:1}
@media(max-width:760px){.pg,.two{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:10px}header input{width:100%}.x{overflow-x:auto}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body>
<header><a class="logo" href="#/">LA <b>MART</b></a><nav><a href="#/shop">Shop</a><a href="#/categories">Categories</a><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/orders">My Orders</a></nav><input id="hq" placeholder="Search products" aria-label="Search"><a href="#/cart">Cart (<span id="cc">0</span>)</a></header>
<main id="app"></main><footer><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a><a href="#/shipping">Shipping</a><a href="#/returns">Returns</a><a href="#/admin">Admin</a><span>© LA MART — Shop · Style · Smile</span></footer><div id="t"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');let S={},CATS=[],TOK=sessionStorage.tok||'';
const api=async(p,o={},adm)=>{const r=await fetch('/api/'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(adm?{Authorization:'Bearer '+TOK}:{})},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j};
const m=n=>'$'+Number(n).toFixed(2),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#t');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2200)};
const cart=()=>JSON.parse(localStorage.cart||'[]'),save=c=>{localStorage.cart=JSON.stringify(c);$('#cc').textContent=c.reduce((a,i)=>a+i.qty,0)};
const eff=p=>p.sale_price||p.price,stars=r=>'<span class="star">'+'★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r))+'</span>';
function add(p,qty=1,variant=''){const c=cart(),i=c.find(x=>x.id==p.id&&x.variant==variant);if(i)i.qty+=qty;else c.push({id:p.id,name:p.name,price:eff(p),image:p.images[0]||'',qty,variant,stock:p.stock});c.forEach(x=>x.id==p.id&&(x.stock=p.stock));save(c)}
window.quick=async(id,go)=>{const p=await api('products/'+id);if(p.stock<1)return toast('Out of stock');if(p.variants.length)return location.hash='#/product/'+id;add(p);toast('Added to cart');if(go)location.hash='#/checkout'};
const card=p=>`<div class="card"><a href="#/product/${p.id}">${p.images[0]?`<img src="${p.images[0]}" alt="${esc(p.name)}" loading="lazy">`:'<div class="ph"></div>'}</a><div class="i"><a href="#/product/${p.id}"><b>${esc(p.name)}</b></a><small>${esc(p.short)}</small><div>${p.sale_price?`<span class="old">${m(p.price)}</span> <span class="sale">${m(p.sale_price)}</span> <span class="tag">-${Math.round(100-p.sale_price/p.price*100)}%</span>`:m(p.price)}</div><div>${stars(p.rating)} <small>(${p.reviews})</small></div>${p.stock<1?'<b class="red">Out of Stock</b>':`<div class="row"><button class="btn sm" onclick="quick(${p.id})">Add to Cart</button><button class="btn sm dk" onclick="quick(${p.id},1)">Buy Now</button></div>`}</div></div>`;
const PAGES={about:['About LA MART','LA MART brings stylish, useful and trending products to your door. Edit this text in index.html.'],contact:['Contact','Email: support@lamart.example · Phone: +00 000 000 000. Replace with your real details.'],privacy:['Privacy Policy','We collect only the details needed to process and deliver your order. We never sell customer data. (Replace with policy reviewed for your jurisdiction.)'],terms:['Terms & Conditions','By ordering you agree to our pricing, availability and delivery terms. (Replace with reviewed legal text.)'],shipping:['Shipping Policy','Orders ship within 1–3 business days. Shipping fee is shown at checkout; free above the threshold set by the store.'],returns:['Return Policy','Unused items may be returned within 14 days of delivery. Contact us with your order number to start a return.']};
const R={
async '' (){const tc=CATS.find(c=>c.name=='Trending Products'),[f,t,n]=await Promise.all([api('products?flag=featured'),api('products?flag=trending'),api('products?flag=new')]);const sec=(h,l)=>l.length?`<h2 class="sh">${h}</h2><div class="grid">${l.slice(0,8).map(card).join('')}</div>`:'';app.innerHTML=`<div class="hero"><h1>Discover Your<br>Everyday Favorites</h1><p>Shop stylish, useful and trending products at LA MART.</p><a class="btn" href="#/shop">Shop Now</a></div>${sec('Featured Products',f)}${sec('Trending Products',t)}<h2 class="sh">Shop by Category</h2><div class="cats">${CATS.map(c=>`<a class="cat" style="background-image:linear-gradient(0deg,rgba(20,17,15,.85),rgba(20,17,15,.15)),url(/uploads/cat-${c.slug}.jpg)" href="#/shop?cat=${c.id}">${esc(c.name)}</a>`).join('')}</div>${sec('New Arrivals',n)}<h2 class="sh">Why Choose LA MART</h2><div class="why">${[['Worldwide Delivery','Tracked shipping to your door.'],['Secure Shopping','Protected checkout and private order data.'],['24/7 Support','Help whenever you need it.'],['Premium Quality','Products chosen for style and value.']].map(([a,b])=>`<div class="box"><h3>${a}</h3><p>${b}</p></div>`).join('')}</div>`},
async categories(){app.innerHTML=`<h1>Categories</h1><div class="cats">${CATS.map(c=>`<a class="cat" href="#/shop?cat=${c.id}">${esc(c.name)}</a>`).join('')}</div>`},
async shop(q){const qs=new URLSearchParams(q).toString(),l=await api('products?'+qs);app.innerHTML=`<h1>Shop</h1><div class="bar"><input id="fq" placeholder="Search" value="${esc(q.q||'')}"><select id="fc"><option value="">All categories</option>${CATS.map(c=>`<option value="${c.id}" ${q.cat==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input id="fmin" type="number" placeholder="Min $" value="${q.min||''}" style="width:90px"><input id="fmax" type="number" placeholder="Max $" value="${q.max||''}" style="width:90px"><select id="fs">${[['','Newest'],['low','Price: low to high'],['high','Price: high to low']].map(o=>`<option value="${o[0]}" ${q.sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><button class="btn dk" id="fg">Apply</button></div><div class="grid">${l.map(card).join('')||'<p>No products match. Try different filters.</p>'}</div>`;$('#fg').onclick=()=>{const p=new URLSearchParams();[['q','fq'],['cat','fc'],['min','fmin'],['max','fmax'],['sort','fs']].forEach(([k,i])=>$('#'+i).value&&p.set(k,$('#'+i).value));location.hash='#/shop?'+p}},
async product(q,id){const p=await api('products/'+id);let sel=p.variants.map(v=>v.options[0]);app.innerHTML=`<div class="pg"><div>${p.images[0]?`<img id="big" src="${p.images[0]}" alt="">`:'<div class="ph" style="aspect-ratio:1"></div>'}<div class="th">${p.images.map(i=>`<img src="${i}" onclick="big.src='${i}'" alt="">`).join('')}</div></div><div><h1>${esc(p.name)}</h1>${stars(p.rating)} (${p.reviews})<h2>${p.sale_price?`<span class="old">${m(p.price)}</span> ${m(p.sale_price)} <span class="tag">-${Math.round(100-p.sale_price/p.price*100)}%</span>`:m(p.price)}</h2><p>${esc(p.description)}</p><ul>${p.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>${p.variants.map((v,i)=>`<label>${esc(v.name)} <select class="vs" data-i="${i}">${v.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label> `).join('')}<p>${p.stock<1?'<b class="red">Out of Stock</b>':p.stock<=5?`Only ${p.stock} left`:'In stock'}</p>${p.stock>0?`<input id="qty" type="number" min="1" max="${p.stock}" value="1" style="width:70px"> <button class="btn" id="a1">Add to Cart</button> <button class="btn dk" id="a2">Buy Now</button>`:''}</div></div><h2>Reviews</h2>${p.review_list.map(r=>`<div class="box" style="margin:8px 0">${stars(r.rating)} <b>${esc(r.name)}</b> <small>${r.created}</small><p>${esc(r.body)}</p></div>`).join('')||'<p>No reviews yet.</p>'}<div class="f box"><b>Write a review</b><input id="rn" placeholder="Your name"><select id="rr">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select><textarea id="rb" placeholder="Your review"></textarea><button class="btn dk" id="rs">Submit review</button></div>${p.related.length?`<h2>Related products</h2><div class="grid">${p.related.map(x=>card({...x,rating:0,reviews:0})).join('')}</div>`:''}`;
const go=n=>{const v=[...document.querySelectorAll('.vs')].map(s=>s.value).join(' / '),q=Math.max(1,Math.min(p.stock,+$('#qty').value||1));add(p,q,v);toast('Added to cart');if(n)location.hash='#/checkout'};if($('#a1')){$('#a1').onclick=()=>go();$('#a2').onclick=()=>go(1)}$('#rs').onclick=async()=>{try{await api('reviews',{method:'POST',body:{product_id:p.id,name:$('#rn').value,rating:$('#rr').value,body:$('#rb').value}});R.product(q,id)}catch(e){toast(e.message)}}},
async cart(){const c=cart(),sub=c.reduce((a,i)=>a+i.price*i.qty,0),ship=!c.length||sub>=S.free_over?0:S.ship_fee;app.innerHTML=`<h1>Your Cart</h1>${c.length?`<div class="x"><table><tr><th>Product<th>Price<th>Qty<th>Total<th></tr>${c.map((i,n)=>`<tr><td>${esc(i.name)}<br><small>${esc(i.variant)}</small><td>${m(i.price)}<td><input type="number" min="1" max="${i.stock}" value="${i.qty}" style="width:64px" onchange="uq(${n},this.value)"><td>${m(i.price*i.qty)}<td><button class="btn sm" onclick="rm(${n})">Remove</button></tr>`).join('')}</table></div><div class="box" style="max-width:340px;margin:16px 0 0 auto"><p>Subtotal: ${m(sub)}</p><p>Shipping: ${ship?m(ship):'Free'}</p><h3>Total: ${m(sub+ship)}</h3><a class="btn dk" href="#/checkout">Proceed to Checkout</a></div>`:'<p>Your cart is empty.</p>'}<p><a class="btn" href="#/shop">Continue Shopping</a></p>`},
async checkout(){const c=cart();if(!c.length)return location.hash='#/cart';const sub=c.reduce((a,i)=>a+i.price*i.qty,0),ship=sub>=S.free_over?0:S.ship_fee;app.innerHTML=`<h1>Checkout</h1><div class="two"><div class="f">${[['name','Full name'],['email','Email'],['phone','Phone number'],['country','Country'],['city','City'],['address','Complete delivery address'],['zip','Postal / ZIP code']].map(([k,l])=>`<input id="c_${k}" placeholder="${l}" aria-label="${l}">`).join('')}<label>Payment <select id="c_m">${S.card?'<option value="card">Card (secure checkout)</option>':''}${S.cod?'<option value="cod">Cash on Delivery</option>':''}</select></label>${!S.card&&!S.cod?'<p class="red">No payment method is enabled.</p>':''}<button class="btn dk" id="po">Place Order</button></div><div class="box"><h3>Order summary</h3>${c.map(i=>`<p>${esc(i.name)} ${esc(i.variant)} × ${i.qty} — ${m(i.price*i.qty)}</p>`).join('')}<p>Shipping: ${ship?m(ship):'Free'}</p><h3>Total: ${m(sub+ship)}</h3></div></div>`;$('#po').onclick=async()=>{const b={items:c.map(i=>({id:i.id,qty:i.qty,variant:i.variant})),method:$('#c_m').value};['name','email','phone','country','city','address','zip'].forEach(k=>b[k]=$('#c_'+k).value);try{$('#po').disabled=1;const r=await api('order',{method:'POST',body:b});save([]);if(r.url)location.href=r.url;else location.hash=`#/order/${r.number}?email=${encodeURIComponent(r.email)}`}catch(e){$('#po').disabled=0;toast(e.message)}}},
async order(q,n){const o=await api(`order?number=${n}&email=${encodeURIComponent(q.email||'')}`);app.innerHTML=`<h1>Order ${o.number}</h1><div class="box"><p>Thank you, ${esc(o.name)}. Status: <b>${o.status}</b> · Payment: <b>${o.pay_status.replace('_',' ')}</b> (${o.method==='cod'?'Cash on Delivery':'Card'})</p>${o.items.map(i=>`<p>${esc(i.name)} ${esc(i.variant)} × ${i.qty} — ${m(i.price*i.qty)}</p>`).join('')}${o.pay_status==='unpaid'&&o.status!=='Cancelled'?'<p><b>Waiting for payment confirmation from the payment provider…</b></p>':''}<p>Shipping ${m(o.shipping)} · <b>Total ${m(o.total)}</b></p><p>Deliver to: ${esc(o.address)}, ${esc(o.city)}, ${esc(o.zip)}, ${esc(o.country)}</p></div>`;if(o.pay_status==='unpaid'&&o.status!=='Cancelled'&&(window._pc=(window._pc||0)+1)<8)setTimeout(()=>location.hash.includes('/order/')&&R.order(q,n),4000)},
async orders(){app.innerHTML=`<h1>My Orders</h1><div class="f"><input id="on" placeholder="Order number (LM-XXXXXX)"><input id="oe" placeholder="Email used at checkout"><button class="btn dk" onclick="location.hash='#/order/'+on.value.trim()+'?email='+encodeURIComponent(oe.value.trim())">View order</button></div>`},
async admin(){if(!TOK)return app.innerHTML=`<h1>Admin login</h1><div class="f"><input id="au" placeholder="Username"><input id="ap" type="password" placeholder="Password"><button class="btn dk" id="al">Sign in</button></div>`,$('#al').onclick=async()=>{try{TOK=(await api('admin/login',{method:'POST',body:{u:au.value,p:ap.value}})).token;sessionStorage.tok=TOK;R.admin()}catch(e){toast(e.message)}};
try{const[ps,os,st]=await Promise.all([api('products'),api('admin/orders',{},1),api('settings')]);A.ps=ps;app.innerHTML=`<h1>Dashboard</h1><button class="btn sm" onclick="sessionStorage.tok=TOK='';R.admin()">Sign out</button><h2>Orders</h2><div class="x"><table><tr><th>#<th>Customer<th>Items<th>Total<th>Payment<th>Status<th>Date</tr>${os.map(o=>`<tr><td>${o.number}<td>${esc(o.name)}<br><small>${esc(o.email)} · ${esc(o.phone)}<br>${esc(o.address)}, ${esc(o.city)} ${esc(o.zip)}, ${esc(o.country)}</small><td>${o.items.map(i=>esc(i.name)+' ×'+i.qty).join('<br>')}<td>${m(o.total)}<td>${o.method} / ${o.pay_status}${o.pay_status!='paid'?` <button class="btn sm" onclick="ost(${o.id},'${o.status}','paid')">Mark paid</button>`:''}<td><select onchange="ost(${o.id},this.value)">${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><td>${o.created}</tr>`).join('')}</table></div>
<h2>Products</h2><button class="btn dk" onclick="pf()">+ Add product</button><div class="x"><table><tr><th>Name<th>Price<th>Sale<th>Stock<th></tr>${ps.map(p=>`<tr><td>${esc(p.name)}<br><small>${['featured','trending','new'].filter(k=>p[k]).join(' · ')}</small><td>${m(p.price)}<td>${p.sale_price?m(p.sale_price):'-'}<td>${p.stock}<td><button class="btn sm" onclick="pf(${p.id})">Edit</button> <button class="btn sm" onclick="pd(${p.id})">Delete</button></tr>`).join('')}</table></div><div id="pform"></div>
<h2>Categories</h2>${CATS.map(c=>`<p>${esc(c.name)} <button class="btn sm" onclick="cr(${c.id},'${esc(c.name)}')">Rename</button> <button class="btn sm" onclick="cd(${c.id})">Delete</button></p>`).join('')}<button class="btn sm dk" onclick="ca()">+ Add category</button>
<h2>Store settings</h2><div class="f box"><label><input type="checkbox" id="sc" ${st.cod?'checked':''}> Enable Cash on Delivery</label><label>Shipping fee <input id="sf" type="number" value="${st.ship_fee}"></label><label>Free shipping over <input id="sv" type="number" value="${st.free_over}"></label><p><small>Card payments: ${st.card?'Stripe enabled':'set STRIPE_SECRET_KEY to enable'}</small></p><button class="btn dk" onclick="ss()">Save settings</button></div>`}catch(e){TOK='';sessionStorage.tok='';R.admin()}}};
const A={ps:[]},rf=async()=>{S=await api('settings');CATS=await api('categories')};
window.uq=(n,v)=>{const c=cart();c[n].qty=Math.max(1,Math.min(c[n].stock,+v||1));save(c);R.cart()};window.rm=n=>{const c=cart();c.splice(n,1);save(c);R.cart()};
window.ost=async(id,s,pay)=>{try{await api('admin/orders/'+id,{method:'PUT',body:{status:s,pay_status:pay}},1)}catch(e){toast(e.message)}R.admin()};
window.pd=async id=>{if(confirm('Delete this product?')){await api('admin/products/'+id,{method:'DELETE'},1);R.admin()}};
window.ca=async()=>{const n=prompt('Category name');if(n){await api('admin/categories',{method:'POST',body:{name:n}},1);await rf();R.admin()}};window.cr=async(id,o)=>{const n=prompt('New name',o);if(n){await api('admin/categories/'+id,{method:'PUT',body:{name:n}},1);await rf();R.admin()}};window.cd=async id=>{if(confirm('Delete category?')){await api('admin/categories/'+id,{method:'DELETE'},1);await rf();R.admin()}};
window.ss=async()=>{await api('admin/settings',{method:'PUT',body:{cod:sc.checked?1:0,ship_fee:sf.value,free_over:sv.value}},1);await rf();toast('Settings saved')};
window.rim=i=>{IMG.splice(i,1);ri()};window.ri=()=>{$('#pim').innerHTML=IMG.map((u,i)=>`<span><img src="${u}" width="56" height="56" style="object-fit:cover" alt=""><button type="button" class="btn sm" onclick="rim(${i})">Remove</button></span>`).join(' ')||'No images yet'};window.pf=id=>{const p=A.ps.find(x=>x.id==id)||{images:[],variants:[],features:[],featured:0,best:0,new:0,trending:0,stock:0};window.IMG=[...p.images];$('#pform').innerHTML=`<div class="f box" style="margin-top:12px"><h3>${id?'Edit':'Add'} product</h3><input id="pn" placeholder="Name" value="${esc(p.name)}"><input id="ps" placeholder="Short description" value="${esc(p.short)}"><textarea id="pdsc" placeholder="Description">${esc(p.description)}</textarea><textarea id="pft" placeholder="Features, one per line">${esc(p.features.join('\n'))}</textarea><select id="pc">${CATS.map(c=>`<option value="${c.id}" ${c.id==p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input id="pp" type="number" step="0.01" placeholder="Price" value="${p.price||''}"><input id="psp" type="number" step="0.01" placeholder="Sale price (optional)" value="${p.sale_price||''}"><input id="pst" type="number" placeholder="Stock" value="${p.stock}"><input id="pv" placeholder="Variants e.g. Size:S,M,L; Color:Black,Beige" value="${esc(p.variants.map(v=>v.name+':'+v.options.join(',')).join('; '))}"><label>Images <input type="file" id="pi" accept="image/*" multiple></label><div id="pim"></div><label><input type="checkbox" id="pf1" ${p.featured?'checked':''}> Featured</label><label><input type="checkbox" id="pf2" ${p.best?'checked':''}> Best seller</label><label><input type="checkbox" id="pf4" ${p.trending?'checked':''}> Trending</label><label><input type="checkbox" id="pf3" ${p.new?'checked':''}> New arrival</label><button class="btn dk" id="psv">Save product</button></div>`;
ri();$('#pi').onchange=async e=>{for(const f of e.target.files){const d=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});IMG.push((await api('admin/upload',{method:'POST',body:{name:f.name,data:d}},1)).url)}ri()};
$('#psv').onclick=async()=>{const b={name:pn.value,short:ps.value,description:pdsc.value,features:pft.value,category_id:+pc.value,price:+pp.value,sale_price:+psp.value||null,stock:+pst.value,images:IMG,featured:+pf1.checked,best:+pf2.checked,new:+pf3.checked,trending:+pf4.checked,variants:pv.value.split(';').map(x=>x.trim()).filter(x=>x.includes(':')).map(x=>({name:x.split(':')[0].trim(),options:x.split(':')[1].split(',').map(o=>o.trim()).filter(Boolean)}))};try{await api('admin/products'+(id?'/'+id:''),{method:id?'PUT':'POST',body:b},1);toast('Product saved');R.admin()}catch(e){toast(e.message)}}};
async function route(){const h=location.hash.slice(2)||'',[path,qs]=h.split('?'),q=Object.fromEntries(new URLSearchParams(qs||'')),[pg,arg]=path.split('/');window.scrollTo(0,0);try{if(PAGES[pg]){app.innerHTML=`<h1>${PAGES[pg][0]}</h1><p style="max-width:640px">${PAGES[pg][1]}</p>`}else await(R[pg]||R[''])(q,arg)}catch(e){app.innerHTML=`<h1>Something went wrong</h1><p>${esc(e.message)}</p><a class="btn" href="#/shop">Back to shop</a>`}}
$('#hq').onkeydown=e=>{if(e.key=='Enter')location.hash='#/shop?q='+encodeURIComponent(e.target.value)};addEventListener('hashchange',route);rf().then(()=>{save(cart());route()});
</script></body></html>
